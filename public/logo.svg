<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo do Emblema -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gradiente do Globo Terrestre -->
    <radialGradient id="globeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>

    <!-- Gradiente dos Continentes -->
    <linearGradient id="continentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Gradiente da Órbita de Voo -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Sombra Suave -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular com Borda Sutil -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4" />

  <!-- Globo Terrestre Central -->
  <g transform="translate(256, 256)">
    <!-- Atmosfera com Brilho -->
    <circle r="130" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="12" />
    <!-- Esfera do Planeta -->
    <circle r="120" fill="url(#globeGrad)" />

    <!-- Paralelos e Meridianos Estilizados -->
    <ellipse rx="120" ry="40" fill="none" stroke="#bae6fd" stroke-opacity="0.2" stroke-width="2" />
    <ellipse rx="120" ry="85" fill="none" stroke="#bae6fd" stroke-opacity="0.2" stroke-width="2" />
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#bae6fd" stroke-opacity="0.3" stroke-width="2" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#bae6fd" stroke-opacity="0.3" stroke-width="2" />
    <ellipse rx="55" ry="120" fill="none" stroke="#bae6fd" stroke-opacity="0.2" stroke-width="2" />

    <!-- Silhueta Estilizada das Américas / Brasil -->
    <path d="M -30,-75 C -15,-60 -5,-35 -15,-10 C -25,10 -10,35 -5,55 C 0,70 -15,85 -25,90 C -40,80 -50,60 -45,40 C -40,20 -55,0 -50,-25 C -45,-50 -40,-65 -30,-75 Z" fill="url(#continentGrad)" opacity="0.65" />
    <path d="M 15,-40 C 25,-30 40,-35 55,-25 C 70,-15 80,0 75,20 C 65,15 50,25 35,15 C 20,5 15,-15 15,-40 Z" fill="url(#continentGrad)" opacity="0.55" />

    <!-- Selo Central SCM -->
    <circle r="36" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">SCM</text>
  </g>

  <!-- Órbita Cênica Tridimensional ao Redor do Planeta -->
  <g transform="translate(256, 256) rotate(-28)">
    <!-- Rastro de Luz Traseiro -->
    <path d="M -210,0 C -210,95 -115,170 0,170 C 115,170 210,95 210,0 C 210,-95 115,-170 0,-170 C -60,-170 -120,-140 -160,-100" fill="none" stroke="url(#orbitGrad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="8 6" opacity="0.9" />
    
    <!-- Avião a Jato Moderno em Alta Definição no Topo da Órbita -->
    <g transform="translate(195, -50) rotate(58) scale(1.15)" filter="url(#glow)">
      <!-- Fuselagem e Asas do Avião -->
      <!-- Sombra / Brilho do Jato -->
      <path d="M 0,-30 L 7,-5 L 28,10 L 28,16 L 7,8 L 6,24 L 14,29 L 14,34 L 0,31 L -14,34 L -14,29 L -6,24 L -7,8 L -28,16 L -28,10 L -7,-5 Z" fill="#ffffff" />
      <path d="M 0,-28 L 5,-4 L 24,9 L 6,6 L 5,23 L 12,28 L 0,25 L -12,28 L -5,23 L -6,6 L -24,9 L -5,-4 Z" fill="#38bdf8" />
      <!-- Turbinas / Chamas de Propulsão -->
      <circle cx="-10" cy="12" r="2.5" fill="#f59e0b" />
      <circle cx="10" cy="12" r="2.5" fill="#f59e0b" />
      <polygon points="-2,32 0,42 2,32" fill="#ef4444" />
    </g>
  </g>

  <!-- Ponto de Partida / Pin Recife -->
  <circle cx="270" cy="285" r="4" fill="#f59e0b" />
  <circle cx="270" cy="285" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.75" />
</svg>
